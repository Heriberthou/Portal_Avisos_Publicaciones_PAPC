# =====================================================================
# PAPC | Publicación en XAMPP compartido: http://IP-DEL-SERVIDOR/papc/
#
# Instalación:
#   1. Copiar este archivo a C:\xampp\apache\conf\extra\papc.conf
#   2. Agregar al FINAL de C:\xampp\apache\conf\httpd.conf:
#        Include conf/extra/papc.conf
#   3. En el .env del proyecto: APP_RUTA_BASE=/papc
#   4. Reiniciar Apache desde el panel de XAMPP.
#
# Si el proyecto no está en C:/xampp/htdocs/papc, cambia las tres rutas.
# =====================================================================

# La URL /papc entra SOLO a public/ (no a la raíz del proyecto).
Alias /papc "C:/xampp/htdocs/papc/public"

# Todo el proyecto queda denegado aunque esté dentro de htdocs, y Apache
# ignora sus .htaccess internos (AllowOverride None).
<Directory "C:/xampp/htdocs/papc">
    Require all denied
    AllowOverride None
    Options None
</Directory>

# Única excepción: public/ (la sección más específica prevalece).
# SymLinksIfOwnerMatch es obligatorio: sin él Apache prohíbe mod_rewrite
# en .htaccess y todas las rutas de la aplicación responden 403. Al ser un
# valor absoluto, también deja desactivados Indexes y MultiViews.
<Directory "C:/xampp/htdocs/papc/public">
    Options SymLinksIfOwnerMatch
    AllowOverride All
    Require all granted
</Directory>
