<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fondo de las pantallas de acceso: atardecer en la costa de Puerto Escondido (ilustración original). -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2468"/>
      <stop offset="0.35" stop-color="#5b4a9e"/>
      <stop offset="0.62" stop-color="#b56fae"/>
      <stop offset="0.8" stop-color="#ee9a9c"/>
      <stop offset="1" stop-color="#f7c08a"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f5fa8"/>
      <stop offset="0.25" stop-color="#3e4f9a"/>
      <stop offset="0.7" stop-color="#1d6f8f"/>
      <stop offset="1" stop-color="#138a8f"/>
    </linearGradient>
    <linearGradient id="reflejo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.12" cy="0.58" r="0.35">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arena" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c79a"/>
      <stop offset="1" stop-color="#c99a6b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#cielo)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>

  <!-- Nubes -->
  <g fill="#f6b3c4" opacity="0.45">
    <ellipse cx="1050" cy="250" rx="260" ry="18"/>
    <ellipse cx="1180" cy="280" rx="200" ry="12"/>
    <ellipse cx="420" cy="180" rx="220" ry="14"/>
    <ellipse cx="1350" cy="160" rx="160" ry="10"/>
  </g>

  <!-- Sol en el horizonte -->
  <circle cx="190" cy="585" r="58" fill="#ffd27a"/>

  <!-- Mar -->
  <rect y="585" width="1600" height="415" fill="url(#mar)"/>
  <path d="M150 590h80l60 260H90z" fill="url(#reflejo)" opacity="0.3"/>
  <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.25">
    <path d="M60 640q40-6 80 0t80 0" stroke-width="3"/>
    <path d="M300 690q50-8 100 0t100 0" stroke-width="3"/>
    <path d="M700 650q60-8 120 0t120 0" stroke-width="2"/>
    <path d="M150 760q60-10 120 0t120 0" stroke-width="3"/>
    <path d="M520 800q70-10 140 0t140 0" stroke-width="3"/>
    <path d="M900 730q60-8 120 0t120 0" stroke-width="2"/>
  </g>

  <!-- Acantilado y vegetación a la derecha -->
  <path d="M1600 470c-60 0-110 20-150 45-50 30-80 30-120 60-40 30-55 70-90 95-30 22-60 40-60 70v260h420z" fill="#2c2a4f"/>
  <path d="M1600 540c-70 10-120 40-160 75-35 30-50 70-85 100-30 25-55 45-55 80v205h300z" fill="#3b3560"/>
  <g fill="#1f1d3d">
    <circle cx="1440" cy="500" r="40"/>
    <circle cx="1500" cy="480" r="48"/>
    <circle cx="1565" cy="470" r="44"/>
    <circle cx="1380" cy="540" r="34"/>
  </g>
  <!-- Casa sobre el acantilado -->
  <rect x="1470" y="430" width="70" height="34" fill="#f2e6dc"/>
  <path d="M1462 432l43-22 43 22z" fill="#b3473c"/>

  <!-- Palmeras -->
  <g stroke="#1b1a36" stroke-linecap="round" fill="none">
    <path d="M1380 520q-6-90 12-170" stroke-width="9"/>
    <path d="M1520 470q4-80 22-150" stroke-width="8"/>
  </g>
  <g fill="#1b1a36">
    <path d="M1392 350q-60-10-95 25 45-15 95-15zM1392 350q60-15 100 15-50-5-100-5zM1392 350q-30-40-80-45 45 20 80 50zM1392 350q30-45 75-40-40 15-75 45zM1392 350q5-50-15-75 20 35 15 75z"/>
    <path d="M1542 320q-55-8-88 22 42-14 88-12zM1542 320q55-12 92 14-46-4-92-4zM1542 320q-26-36-72-40 40 18 72 44zM1542 320q28-40 70-36-38 14-70 40z"/>
  </g>

  <!-- Playa -->
  <path d="M1000 1000c80-60 200-110 330-140 110-25 190-30 270-30v170z" fill="url(#arena)"/>
  <path d="M1010 995c90-55 210-100 330-125 100-22 180-28 260-28" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.55"/>

  <!-- Bugambilias en la esquina inferior izquierda -->
  <g fill="#1f3d2b">
    <ellipse cx="30" cy="930" rx="60" ry="26" transform="rotate(-30 30 930)"/>
    <ellipse cx="120" cy="985" rx="55" ry="20" transform="rotate(-10 120 985)"/>
  </g>
  <g fill="#c2378f">
    <circle cx="22" cy="900" r="14"/><circle cx="48" cy="915" r="12"/><circle cx="30" cy="935" r="13"/>
    <circle cx="70" cy="950" r="12"/><circle cx="95" cy="970" r="14"/><circle cx="125" cy="962" r="11"/>
    <circle cx="60" cy="985" r="13"/><circle cx="150" cy="985" r="12"/>
  </g>
  <g fill="#e05aa8">
    <circle cx="38" cy="908" r="6"/><circle cx="84" cy="962" r="6"/><circle cx="112" cy="978" r="5"/><circle cx="20" cy="930" r="5"/>
  </g>
</svg>
